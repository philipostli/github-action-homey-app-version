# action.yml
name: 'Homey App — Update Version'
description: "Update a Homey app's version"
inputs:
  version:
    description: 'Version. Can be either major, minor, patch, or a semver version.'
    required: true
  changelog:
    description: 'Changelog of the new version in English.'
    required: false
  # Language-specific changelogs (dynamically supported based on Homey CLI)
  # Use format: changelog_{language_code}
outputs:
  version:
    description: 'The new version'
runs:
  using: 'docker'
  image: 'Dockerfile'
